<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý công việc</title>
    <link rel="stylesheet" href="QLCV.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- THÔNG BÁO TOAST -->
    <div id="toast" class="toast hidden"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <h1>TaskBoard</h1>
            </div>
            <button id="btn-open-form" class="btn-primary">
                <span>+</span> Thêm công việc
            </button>
        </div>
    </header>

    <!-- THỐNG KÊ -->
    <section class="stats-bar">
        <div class="stat-item">
            <span class="stat-number" id="stat-total">0</span>
            <span class="stat-label">Tổng cộng</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span class="stat-number done" id="stat-done">0</span>
            <span class="stat-label">Hoàn thành</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span class="stat-number pending" id="stat-pending">0</span>
            <span class="stat-label">Chưa xong</span>
        </div>
    </section>

    <!-- DANH SÁCH CÔNG VIỆC -->
    <main class="main">
        <div id="task-list" class="task-list"></div>

        <!-- TRẠNG THÁI RỖNG -->
        <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">📋</div>
            <p>Chưa có công việc nào.</p>
            <span>Nhấn <strong>+ Thêm công việc</strong> để bắt đầu!</span>
        </div>
    </main>

    <!-- OVERLAY & POPUP FORM -->
    <div id="overlay" class="overlay hidden"></div>

    <div id="task-form-popup" class="popup hidden">
        <div class="popup-header">
            <h2 id="form-title">Thêm công việc</h2>
            <button id="btn-close-form" class="btn-close">✕</button>
        </div>

        <form id="task-form" novalidate>
            <!-- Input ẩn lưu id khi đang sửa -->
            <input type="hidden" id="edit-id" value="" />

            <div class="form-group">
                <label for="task-title">Tiêu đề <span class="required">*</span></label>
                <input type="text" id="task-title" placeholder="Nhập tiêu đề công việc..." maxlength="100" />
                <span class="error-msg" id="err-title"></span>
            </div>

            <div class="form-group">
                <label for="task-desc">Mô tả ngắn</label>
                <textarea id="task-desc" rows="3" placeholder="Mô tả thêm về công việc..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="task-due">Hạn hoàn thành</label>
                    <input type="date" id="task-due" />
                </div>
                <div class="form-group">
                    <label for="task-priority">Mức ưu tiên</label>
                    <select id="task-priority">
                        <option class="low" value="low"> Thấp</option>
                        <option class="medium" value="medium" selected>Trung bình</option>
                        <option class="high" value="high"> Cao</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" id="btn-cancel" class="btn-secondary">Hủy</button>
                <button type="submit" id="btn-submit" class="btn-primary">Lưu</button>
            </div>
        </form>
    </div>

    <script src="QLCV.js"></script>
</body>

</html>
